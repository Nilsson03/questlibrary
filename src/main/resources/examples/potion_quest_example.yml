id: "potion_master"

meta:
  displayName: "Мастер зелий"
  weight: 3
  daily: false
  description:
    - "Выпей различные зелья"
    - "Награда: 500 монет"

objectives:
  # Пример 1: Любое зелье (только материал)
  - key: "drink_any_potion"
    type: "DRINK_POTION"
    goals:
      - type: "material"
        material: "POTION"
        value: 5

  # Пример 2: Конкретное зелье - Зелье ночного зрения (обычное)
  - key: "drink_night_vision"
    type: "DRINK_POTION"
    goals:
      - type: "itemStack"
        material: "POTION"
        potionData:
          type: "NIGHT_VISION"
          extended: false
          upgraded: false
        value: 1

  # Пример 3: Зелье ночного зрения (удлинённое)
  - key: "drink_night_vision_extended"
    type: "DRINK_POTION"
    goals:
      - type: "itemStack"
        material: "POTION"
        potionData:
          type: "NIGHT_VISION"
          extended: true
          upgraded: false
        value: 2

  # Пример 4: Зелье силы (усиленное)
  - key: "drink_strength_upgraded"
    type: "DRINK_POTION"
    goals:
      - type: "itemStack"
        material: "POTION"
        potionData:
          type: "STRENGTH"
          extended: false
          upgraded: true
        value: 1

  # Пример 5: Зелье лечения (обычное)
  - key: "drink_healing"
    type: "DRINK_POTION"
    goals:
      - type: "itemStack"
        material: "POTION"
        potionData:
          type: "INSTANT_HEAL"
          extended: false
          upgraded: false
        value: 3

  # Пример 6: Зелье скорости (удлинённое)
  - key: "drink_speed_extended"
    type: "DRINK_POTION"
    goals:
      - type: "itemStack"
        material: "POTION"
        potionData:
          type: "SPEED"
          extended: true
          upgraded: false
        value: 2

  # Пример 7: Взрывное зелье (SPLASH_POTION)
  - key: "throw_splash_potion"
    type: "DRINK_POTION"
    goals:
      - type: "itemStack"
        material: "SPLASH_POTION"
        potionData:
          type: "POISON"
          extended: false
          upgraded: false
        value: 1

reward:
  uniqueIdentificationKey: "potion-master-001"
  commands:
    - "eco give %player% 500"
    - "tellraw %player% {\"text\":\"Ты стал мастером зелий! +500 монет\",\"color\":\"light_purple\"}"
